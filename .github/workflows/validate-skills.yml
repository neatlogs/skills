name: Validate Skills

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: skills-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: neatlogs/neatlogs
          ref: 96ffcf4dc72b78e19e30daef4947fd65b6f455c4
          path: .sdk-sources/python

      - uses: actions/checkout@v4
        with:
          repository: neatlogs/neatlogs-typescript
          ref: 39d3354b03535f532990007e09da6fb51167e70f
          path: .sdk-sources/typescript

      - uses: actions/checkout@v4
        with:
          repository: neatlogs/neatlogs-go
          ref: 8dc5a8839ded1ee9853a944b562065ca5104b0f2
          path: .sdk-sources/go

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Validate skills and telemetry contract
        env:
          NEATLOGS_PYTHON_SOURCE: .sdk-sources/python
          NEATLOGS_TYPESCRIPT_SOURCE: .sdk-sources/typescript
          NEATLOGS_GO_SOURCE: .sdk-sources/go
        run: python scripts/validate-skills.py

      - name: Validate release-order preflight inputs
        run: python scripts/check-release-readiness.py --validate-only

      - name: Package every public skill
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/neatlogs-skills"
          python scripts/build-skill-release.py --output "$artifact_dir"
          for archive in "$artifact_dir"/*.zip; do unzip -tq "$archive"; done
