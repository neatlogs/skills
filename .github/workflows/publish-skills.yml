name: Publish Skills

on:
  push:
    paths:
      - 'skills/**'
      - 'contracts/skills-support-v1.json'
      - 'contracts/v2/manifest.json'
      - '.claude-plugin/plugin.json'
      - '.claude-plugin/marketplace.json'
      - 'scripts/build-skill-release.py'
      - 'scripts/validate-skills.py'
      - 'requirements-ci.txt'
      - '.github/workflows/publish-skills.yml'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate public contracts and release assets
        run: |
          python -m pip install -r requirements-ci.txt
          python scripts/validate-skills.py

      - name: Resolve release version
        id: release
        run: |
          version=$(node -p "require('./.claude-plugin/plugin.json').version")
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=skills-v$version" >> "$GITHUB_OUTPUT"
          echo "Publishing skills version $version"

      - name: Require a new immutable release tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG"; then
            echo "Release tag $RELEASE_TAG already exists; bump the Skill version instead of replacing signed-off assets." >&2
            exit 1
          fi

      - name: Build deterministic checksummed release assets
        run: python3 scripts/build-skill-release.py --output release-assets

      - name: Create/update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Skills v${{ steps.release.outputs.version }}
          body: Auto-published skill packages for the Neatlogs wizard
          files: |
            release-assets/*.zip
            release-assets/skill-menu.json
            release-assets/skills-support-v1.json
            release-assets/SHA256SUMS
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
