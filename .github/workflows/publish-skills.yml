name: Daily Skills release

on:
  schedule:
    - cron: '41 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-skills
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      published: ${{ steps.verify-release.outputs.published }}
      version: ${{ steps.plan.outputs.version }}
      release_url: ${{ steps.verify-release.outputs.release_url }}
      zip_count: ${{ steps.verify-release.outputs.zip_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Plan the daily release
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/release/weekly.py --apply > "$RUNNER_TEMP/release-plan.json"
          cat "$RUNNER_TEMP/release-plan.json"
          action=$(jq -r .action "$RUNNER_TEMP/release-plan.json")
          version=$(jq -r .version "$RUNNER_TEMP/release-plan.json")
          commit=$(jq -r '.commit // false' "$RUNNER_TEMP/release-plan.json")
          retry=false
          # A previous run may have created the tag but failed before uploading
          # the GitHub Release. Retry that exact version without bumping again.
          if [[ "$action" == skip ]] && ! gh release view "skills-v${version}" >/dev/null 2>&1; then
            action=publish
            retry=true
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "retry=$retry" >> "$GITHUB_OUTPUT"

      - name: Restore exact tagged source for a failed Release upload
        if: steps.plan.outputs.retry == 'true'
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: git checkout --detach "skills-v${RELEASE_VERSION}"

      - name: Check release App configuration
        if: steps.plan.outputs.action == 'publish'
        shell: bash
        env:
          RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          test -n "$RELEASE_APP_ID" || { echo 'RELEASE_APP_ID is missing' >&2; exit 1; }
          test -n "$RELEASE_APP_PRIVATE_KEY" || { echo 'RELEASE_APP_PRIVATE_KEY is missing' >&2; exit 1; }

      - name: Validate release inputs
        if: steps.plan.outputs.action == 'publish'
        run: |
          python -m pip install -r requirements-ci.txt
          python scripts/validate-skills.py
          python -m pytest -q

      - name: Create a repository-scoped release token
        if: steps.plan.outputs.action == 'publish'
        id: release-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit version and tag exact release source
        if: steps.plan.outputs.action == 'publish'
        shell: bash
        env:
          RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_COMMIT: ${{ steps.plan.outputs.commit }}
        run: |
          set -euo pipefail
          git config user.name 'neatlogs-release[bot]'
          git config user.email 'neatlogs-release[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [[ "$RELEASE_COMMIT" == true ]]; then
            git add .claude-plugin/plugin.json .claude-plugin/marketplace.json contracts/launch-support-manifest.json
            git diff --cached --check
            git commit -m "chore(release): skills ${RELEASE_VERSION}"
            git push origin HEAD:refs/heads/main
          fi
          git diff --exit-code
          tag="skills-v${RELEASE_VERSION}"
          if git rev-parse --verify "refs/tags/${tag}^{commit}" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$tag")" = "$(git rev-parse HEAD)" || {
              echo "Existing ${tag} points to another commit" >&2; exit 1;
            }
          else
            git tag -a "$tag" -m "Skills ${RELEASE_VERSION}"
          fi
          git push origin "refs/tags/${tag}"

      - name: Package skills
        if: steps.plan.outputs.action == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          cd skills
          for dir in */; do
            if [[ -f "${dir}SKILL.md" ]]; then
              skill_id="${dir%/}"
              zip -qr "${skill_id}.zip" "$dir"
              unzip -tq "${skill_id}.zip"
            fi
          done

      - name: Generate skill-menu.json
        if: steps.plan.outputs.action == 'publish'
        shell: bash
        env:
          SKILLS_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          cd skills
          base="https://github.com/neatlogs/skills/releases/latest/download"
          entries=""
          for dir in */; do
            [[ -f "${dir}SKILL.md" ]] || continue
            skill_id="${dir%/}"
            name=$(grep -m1 '^description:' "${dir}SKILL.md" | sed 's/^description:[[:space:]]*//' | tr -d '"' | cut -c1-80)
            [[ -n "$name" ]] || name="$skill_id"
            name=$(printf '%s' "$name" | sed 's/\\/\\\\/g; s/"/\\"/g')
            [[ -z "$entries" ]] || entries="${entries},"
            entries="${entries}{\"id\":\"${skill_id}\",\"name\":\"${name}\",\"downloadUrl\":\"${base}/${skill_id}.zip\"}"
          done
          printf '{"version":"%s","categories":{"setup":[%s]}}' "$SKILLS_VERSION" "$entries" > skill-menu.json
          python3 -m json.tool skill-menu.json >/dev/null

      - name: Create the GitHub Release
        if: steps.plan.outputs.action == 'publish'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: skills-v${{ steps.plan.outputs.version }}
          name: Skills v${{ steps.plan.outputs.version }}
          body: Auto-published NeatLogs skill packages for coding agents
          files: |
            skills/*.zip
            skills/skill-menu.json
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}

      - name: Verify the published release and assets
        if: steps.plan.outputs.action == 'publish'
        id: verify-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          tag="skills-v${RELEASE_VERSION}"
          release=$(gh release view "$tag" --json url,tagName,isDraft,isPrerelease,assets)
          jq -e --arg tag "$tag" '
            .tagName == $tag and
            .isDraft == false and
            .isPrerelease == false and
            any(.assets[]; .name == "skill-menu.json") and
            any(.assets[]; .name | endswith(".zip"))
          ' <<< "$release" >/dev/null
          remote_tag=$(git ls-remote --tags origin "refs/tags/${tag}" | cut -f1)
          test -n "$remote_tag"
          test "$remote_tag" = "$(git rev-parse "refs/tags/${tag}")"
          test "$(git rev-list -n 1 "$tag")" = "$(git rev-parse HEAD)"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "release_url=$(jq -r .url <<< "$release")" >> "$GITHUB_OUTPUT"
          echo "zip_count=$(jq '[.assets[].name | select(endswith(".zip"))] | length' <<< "$release")" >> "$GITHUB_OUTPUT"

  notify-slack:
    name: Notify Slack of published Skills release
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send release notification
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.COMPAT_SLACK_WEBHOOK_URL }}
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_URL: ${{ needs.publish.outputs.release_url }}
          ZIP_COUNT: ${{ needs.publish.outputs.zip_count }}
        run: |
          set -euo pipefail
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo '::error::COMPAT_SLACK_WEBHOOK_URL is missing; the Skills release is published, but Slack was not notified.'
            exit 1
          fi
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf -v message ':white_check_mark: *Skills release skills-v%s published*\n<%s|GitHub Release> · %s skill ZIPs and skill-menu.json\n<%s|Release workflow>' \
            "$RELEASE_VERSION" "$RELEASE_URL" "$ZIP_COUNT" "$run_url"
          payload=$(jq -n --arg text "$message" '{text: $text}')
          response=$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors --max-time 15 \
            --header 'Content-type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL")
          if [[ "$response" != ok ]]; then
            echo "::error::Slack did not acknowledge the release notification: $response"
            exit 1
          fi
